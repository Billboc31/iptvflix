[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter recommendation-engine build"

[deploy]
# Root Directory = repo root; Config-as-code = this file (same pattern as apps/web).
startCommand = "pnpm --filter recommendation-engine start:railway"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
